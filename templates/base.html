<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
  <style>
      body{
        background: linear-gradient(to right, rgb(20, 169, 206), rgb(168, 168, 219));
        font-family: 'Poppins', sans-serif;
      }
      .h{
        color: #1f1f1f;
      }
      p{
        color: #333333;
      }
      a:hover{
         background-color: orange;
      }
      
  </style>
    <nav class="navbar navbar-expand-lg bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Nicodocs</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll" aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse " id="navbarScroll">
      <ul class="navbar-nav me-auto my-2 my-lg-0 navbar-nav-scroll mx-auto" style="--bs-scroll-height: 100px;">
        <li class="nav-item ">
          <a class="nav-link active text-white " aria-current="page" href="{% url 'index' %}">Accueil</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="{% url 'singup' %}" style="color:#f8f9fa;">S'inscrire</a>
        </li>
        
        <li class="nav-item">
          <a class="nav-link " href="{% url 'login' %}" style="color:#f8f9fa;" aria-disabled="true">Connexion</a>
        </li>

        {% if user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link " href="{% url 'mes_ebooks' %}" style="color:#f8f9fa;" aria-disabled="true"><strong style="background-color: maroon;">Mes ebook</strong> </a>
        </li>
        <li class="nav-item">
          <a class="nav-link " href="{% url 'logout' %}" style="color:#f8f9fa;" aria-disabled="true">Deconnexion</a>
        </li>
        {% endif %}
      </ul>
      <form class="d-flex" role="search" method="get">
        {% csrf_token %}
        <input class="form-control me-2" type="search" name="recherche" placeholder="Search" aria-label="Search"/>
        <button class="btn btn-outline-dark" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>


{% block content %}
{% endblock %}
<footer class="bg-dark text-white py-4 mt-5">
  <div class="container text-center">
    <p class="mb-1">© 2025 MonSite. Tous droits réservés.</p>
    <a href="#" class="text-white me-3">Mentions légales</a>
    <a href="#" class="text-white">Contact</a>
  </div>
</footer>
  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
